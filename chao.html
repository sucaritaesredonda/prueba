<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
.btn-83 {
    position: relative;
    background-color: transparent;
    border: none;
    width: 120px;
    height: 45px;
    border-radius: 5px;
    transition: all .3s;
    font-family: Arial, Helvetica, sans-serif;
    cursor: pointer;
    text-decoration: none;
    user-select: none;
    display: inline-flex;
    z-index: 1;
    padding: 0;
    /*** full width block ***/
    /* width: 100%; */
}

.btn-83-text {
    width: 100%;
    height: 100%;
    background-color: rgba(230, 230, 230, 0.466);
    border: none;
    border-radius: 5px;
    backdrop-filter: blur(5px);
    color: #232323;
    display: flex;
    font-weight: bold;
    align-items: center;
    justify-content: center;
    letter-spacing: 0.8px;
    font-size: 15px;
}

.btn-83-bg {
    position: absolute;
    content: "";
    width: 100%;
    height: 100%;
    background-image: linear-gradient(138deg, #ff00e0, #2196F3);
    z-index: -1;
    left: 6px;
    top: 6px;
    border-radius: 7px;
    pointer-events: none;
    transition: all .3s;
}

.btn-83:hover {
    transform: translateY(-2px);
}

.btn-83:hover .BG {
    transform: translateY(-1px);
}

.btn-83:disabled {
    pointer-events: none;
    opacity: .65;
    color: #7e7e7e;
    box-shadow: none;
    background: none;
}
.btn-83:disabled .btn-83-text {
    background-color: #dcdcdc;
}

</style>

</head>
<body>
<h1>CHAOOOOOO</h1>


<a href="index.html">

    <button class="btn-83">
  <span class="btn-83-text">volver al inicio</span>
  <span class="btn-83-bg"></span>
</button>


</a>

</body>
</html>
